#:schema https://mago.carthage.software/1.57.0/schema.json
version = "1"
php-version = "8.4.0"

[source]
workspace = "."
paths = ["src/", "tests/"]
# Templates are not PHP source, though their files end in .php.
excludes = ["vendor/**", "**/*.arc.php"]

[formatter]
print-width = 120

[linter]
integrations = ["phpunit"]

[linter.rules]
# The compiler reads a template in one pass whose branches follow the syntax.
cyclomatic-complexity = { enabled = false }
halstead = { enabled = false }
kan-defect = { enabled = false }
too-many-methods = { enabled = false }
# File operations are checked by their return value and reported as ArcException.
no-error-control-operator = { enabled = false }
assertion-style = { enabled = false }
# The compiler's state is one pass's: splitting it into objects would only add indirection.
too-many-properties = { enabled = false }
# Named arguments around PHP's string functions would make the scanner denser.
literal-named-argument = { enabled = false }
# Whether a template is a component is part of what is compiled.
no-boolean-flag-parameter = { enabled = false }
no-else-clause = { enabled = false }
# isset() is the check for optional array keys, where null is absent.
no-isset = { enabled = false }
